name: Source verification

on:
  push:
    branches: [dev/11-26]
  pull_request:
    branches: [dev/11-26]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure Core
        run: cmake --preset core-gcc-debug
      - name: Build Core
        run: cmake --build --preset core-gcc-debug
      - name: Test Core
        run: ctest --preset core-gcc-debug

  core-msvc:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify source with MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'The runner does not provide vswhere.'
          }
          $installations = @(& $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -ne 1) {
            throw 'Expected exactly one Visual Studio 2022 VC x64 installation.'
          }
          $devCmd = Join-Path $installations[0] 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) {
            throw 'The selected installation does not provide VsDevCmd.bat.'
          }
          $env:CORDIS_VS_DEV_CMD = $devCmd
          $script = Join-Path $env:RUNNER_TEMP 'cordis-core-msvc.cmd'
          @'
          @echo off
          call "%CORDIS_VS_DEV_CMD%" -no_logo -arch=x64 -host_arch=x64 || exit /b 1
          cmake --preset core-msvc-debug || exit /b 1
          cmake --build --preset core-msvc-debug || exit /b 1
          ctest --preset core-msvc-debug
          '@ | Set-Content -LiteralPath $script -Encoding ascii
          & $env:ComSpec /d /c "call `"$script`""
          if ($LASTEXITCODE -ne 0) {
            throw "Source verification exited with code $LASTEXITCODE."
          }
