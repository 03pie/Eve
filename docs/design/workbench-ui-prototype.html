  :root {
    color-scheme: light;
    --base-chrome:#ececec; --base-surface:#fdfdfd; --base-well:#f0f0f0; --base-card:#f7f7f7;
    --base-popup:#f6f6f6; --base-dialog:#f7f7f7; --base-hover:#f3f3f3; --base-tint:#e0e0e0;
    --chrome:var(--base-chrome); --surface:var(--base-surface); --well:var(--base-well); --card:var(--base-card);
    --popup:var(--base-popup); --dialog:var(--base-dialog); --hover:var(--base-hover); --tint:var(--base-tint);
    --option-fill:var(--base-surface); --scrim:#13203440;
    --line: #d6d6d6; --ink: #000; --base-muted:#656565; --muted:var(--base-muted);
    --blue: #0067c0; --blue-hover: #1975c5; --blue-press: #3183ca; --on-blue: white;
    --error: #a62b35; --error-bg: #f5e5e7; --warn: #805410; --shadow: 0 8px 32px #0003;
    font: 14px/1.5 "Microsoft YaHei","Microsoft YaHei UI",sans-serif;
  }
  :root.dark {
    color-scheme: dark;
    --base-chrome:#202020; --base-surface:#343434; --base-well:#272727; --base-card:#2c2c2c;
    --base-popup:#2c2c2c; --base-dialog:#1f1f1f; --base-hover:#404040; --base-tint:#393939;
    --scrim:#08090c66; --line: #4b4b4b; --ink: #fff; --base-muted:#c1c1c3;
    --blue: #4abcf7; --blue-hover: #47b1e8; --blue-press: #42a1d2; --on-blue: black;
    --error: #ffa7a2; --error-bg: #433032; --warn: #f3c68a; --shadow: 0 8px 32px #0006;
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--base-chrome); color: var(--ink); isolation:isolate }
  body, #app { height: 100vh; height: 100dvh; min-height: 280px }
  #app { display: grid; grid-template: 44px minmax(0,1fr) 28px / 52px minmax(0,1fr) }
  button, input, select, textarea { font: inherit; color: inherit }
  button, select, input, textarea { border: 1px solid var(--line); border-radius: 4px; background: var(--surface) }
  option { color:var(--ink); background:var(--option-fill) }
  button, select { min-height: 32px; padding: 4px 12px }
  button { cursor: pointer; white-space: nowrap }
  button:hover:enabled, select:hover { background-color: var(--hover) }
  button:disabled { opacity: .55; cursor: default }
  button.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); font-weight: 500 }
  button.primary:hover { background: var(--blue-hover) } button.primary:active { background: var(--blue-press) }
  button.flat, button.icon { background: transparent; border-color: transparent }
  button.icon { display: inline-grid; place-items: center; width: 32px; padding: 0 }
  button:hover:enabled.icon, button:hover:enabled.flat { background: var(--hover) }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
  .glyph { font: normal 16px/1 ElaAwesome; pointer-events: none; vertical-align: -2px }
  h1,h2,h3,p { margin: 0 }
  h1 { font-size: 24px; line-height: 1.3; font-weight: 600 }
  h2 { font-size: 20px; font-weight: 600 } h3 { font-size: 16px; font-weight: 600 }
  small,.muted { color: var(--muted) } small { font-size: 12px } label { font-weight: 500 }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0 }
  .wrap { flex-wrap: wrap } .between { justify-content: space-between } .grow { flex: 1; min-width: 0 }
  .stack { display: grid; align-content: start; gap: 12px } .right { margin-left: auto }
  [hidden] { display: none !important }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
  .history-search { gap: 4px } .history-search .pagesearch { min-width: 0; flex: 1 }
  .titlebar { position:relative; z-index:2; grid-column: 1/-1; display: grid; grid-template-columns: minmax(max-content,1fr) minmax(200px,430px) minmax(max-content,.55fr); align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line) }
  .brand { display: inline-flex; align-items: center; gap: 8px; font: 14px "Microsoft YaHei",sans-serif; letter-spacing: 0 }
  .pagesearch { position:relative; color:var(--muted) }
  #query { width:100%; min-width:0; height:32px; padding:4px 32px 4px 12px; border-bottom-color:var(--muted) }
  #query:focus { outline:0; border-bottom:2px solid var(--blue) }
  .pagesearch > .glyph { position:absolute; right:10px; top:8px }
  #launcher { position:absolute; z-index:5; top:calc(100% + 2px); left:0; right:0; min-width:min(180px,55vw);
    max-height:min(320px,55vh); overflow-y:auto; padding:4px; border:1px solid var(--line); border-radius:6px;
    background:var(--popup); color:var(--ink); box-shadow:0 3px 10px #0003 }
  #matches button { width:100%; padding:3px 10px; min-height:28px; text-align:left; border:none; background:transparent }
  #matches button:hover, #matches button[aria-selected="true"] { background:var(--tint) }
  #launcherEmpty { padding:4px 10px }
  kbd { font: 12px "Microsoft YaHei",sans-serif; margin-left: 4px; white-space: nowrap }
  #rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-right: 1px solid var(--line) }
  #rail .icon { width: 40px; height: 40px; position: relative }
  #rail .glyph { font-size: 19px }
  #rail .active { color: var(--ink); background: var(--tint) }
  #rail .active::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; background: var(--blue); border-radius: 3px }
  .workspace { display: flex; flex-flow: column; min-height: 0; min-width: 0; container-type: inline-size }
  .tabs { display: flex; overflow-x: auto; min-height: 36px; border-bottom: 1px solid var(--line); align-items: end; padding-left: 8px }
  .tab { position: relative; min-width: 148px; justify-content: space-between; background: var(--tint); display: flex; align-items: center; gap: 4px; padding: 0 4px; border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0 }
  .tab.active { background: var(--well) }
  .tab.active::before { content:""; width:3px; height:20px; background:var(--blue); border-radius:2px; position:absolute; left:3px; top:50%; transform:translateY(-50%) }
  .tab button { min-height: 28px; background: transparent; border: 0; padding: 0 8px } .tab button[data-act=page] { flex:1 }
  .tab .icon { width: 24px } .tab .icon .glyph { font-size: 10px }
  main { min-height: 0; flex: 1; overflow: auto; background: var(--well) }
  .page { max-width: 1120px; margin: auto; padding: 28px clamp(16px,3.2vw,44px) 36px }

  .hero p { color:white; margin-top:4px } .hero button { min-height:36px; border-color:#fff }
  .home-page { max-width: 1008px; padding: 20px 24px; margin: 0 }
  .section-head { margin: 24px 0 12px }
  .instances { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px }
  .instance { display: flex; flex-direction: column; gap: 10px; width: min(280px,100%); min-height: 144px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px }
  .instance-name { display: flex; gap: 12px; align-items: center; min-width: 0 }
  .module-icon { display: grid; place-items: center; width: 48px; height: 48px; color: white; background: #3476cb; border-radius: 8px; flex: none }
  .instance h3 { overflow-wrap: anywhere } .instance .context { color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
  .instance-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto }
  .instance-actions button { flex: 1; min-height: 30px } .instance-controls .toggle { flex: none }
  .divider { border-top: 1px solid var(--line); margin: 16px 0 }
  .state { font-size: 13px; display: inline-flex; align-items: center; gap: 4px } .state .glyph { font-size:14px }
  .module-icon.reporter { background:#7c5cc4 }
  .toggle { min-height: 24px; width: 40px; border-radius: 16px; padding: 2px; text-align: left; background: var(--well) }
  .toggle::after { content: ""; display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--muted) }
  .toggle[aria-checked="true"], .toggle[aria-checked="true"]:hover { background: var(--blue); border-color: var(--blue) }
  .toggle[aria-checked="true"]::after { margin-left: auto; background: var(--on-blue) }
  .panel-head,.status { display: flex; align-items: center; gap: 8px; min-width: 0 }
  .config-field { display: block; resize: vertical; width: 100%; min-height: 140px; margin: 8px 0; padding: 8px }
  .state.failed,.error-text,.field-error { color: var(--error) }
  .field-error { display: block; font-size: 13px } .field-error:not(:empty) { margin-top: 4px }
  [aria-invalid="true"] { border-color: var(--error) }
  .issue { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 0 }
  dialog.workspace-config { width:min(800px,calc(100vw - 24px)) }
  #configurationText { min-height: 200px; max-height: 36vh; resize: vertical }
  .config-status { display:flex; flex-wrap:wrap; gap:8px 20px; padding:8px 0; border-block:1px solid var(--line); font-size:13px }
  .config-status strong { font-weight:500 }
  .bottom { flex: none; height: 160px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--chrome) }
  #panelDivider { height: 7px; flex: none; border-top: 1px solid var(--line); cursor: ns-resize; touch-action: none }
  #panelDivider:hover, #panelDivider:focus-visible { border-color: var(--blue) }
  #panelDivider:focus-visible { outline-offset: -2px }
  .panel-head { flex: none; margin: 0 16px; gap: 4px; border-bottom: 1px solid var(--line) }
  #panelContent { flex: 1 1 0; min-height: 0; overflow: auto; padding: 0 16px 8px; container: panelBody / size }
  .panel-head button { border-radius: 0; min-height: 36px }
  .panel-head .active { border-bottom:2px solid var(--blue); color:var(--ink) }
  .filters { flex-wrap: wrap; padding: 8px 0 }
  .filters select { min-width: 0; max-width: 100%; font-size: 13px }
  @container panelBody (min-width: 580px) and (min-height: 88px) {
    .filters { position: sticky; top: 0; z-index: 1; background:var(--filter-surface,var(--chrome)) }
    .logline { scroll-margin-top: 48px }
  }
  .logline { display: grid; grid-template-columns: 65px 56px minmax(100px,145px) 1fr; align-items: baseline; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 13px }
  .logline time,.level { font-variant-numeric: tabular-nums; color: var(--muted) }
  .level.error { color: var(--error); font-weight: 600 } .level.warning { color: var(--warn); font-weight: 600 } .logline > * { min-width: 0; overflow-wrap: anywhere } .logline.target { box-shadow: inset 3px 0 var(--blue); background: var(--tint) }
  .status { grid-column: 1/-1; padding: 0 12px; font-size: 12px; border-top: 1px solid var(--line) }
  .status button { min-height: 24px; padding: 0 8px; font-size: 12px }
  .status .glyph { font-size: 13px }
  dialog { width: min(440px,calc(100vw - 24px)); max-height: 88vh; overflow: auto; padding: 20px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); box-shadow: var(--shadow); background: var(--dialog) }
  dialog::backdrop { background:var(--scrim) }
  dialog header, #notices header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px }
  dialog fieldset { border: 0; padding: 0; margin: 0 } dialog input,dialog select { width: 100%; padding: 8px }
  dialog label { display: block; margin-bottom: 4px } dialog .actions { display: flex; align-items: center; justify-content: end; flex-wrap: wrap; gap: 8px; margin-top: 16px }
  .details { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0 } dt { color: var(--muted) } dd { margin: 0; overflow-wrap: anywhere }
  #notices { position: fixed; z-index: 3; width: min(370px,calc(100% - 20px)); max-height: 65vh; overflow: auto; right: 8px; bottom: 32px; padding: 16px; background: var(--popup); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px }
  .notice { padding: 12px 0 0; border-top: 1px solid var(--line) } .notice h3 { margin: 4px 0 } .notice p { margin-bottom: 8px }
  .settings-page { --settings-columns:clamp(144px,17%,180px) minmax(0,1fr);
    height:100%; min-height:188px; max-width:1020px; margin:0; padding:20px 24px 12px;
    display:flex; flex-direction:column; gap:18px }
  .settings-header,.settings { display:grid; grid-template-columns:var(--settings-columns); column-gap:24px }
  .settings-header { align-items:center }
  .settings { flex:1; min-height:0 }
  .settings-tools { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; justify-content:space-between }

      else { item=Object.assign(instances[state.object],values); drafts.delete(item.path); }
      changedTarget();
      if(item.failed&&item.on) notifyFailure(item); else record(modules[module].label,"信息",item.name+"配置已应用。",item.path);
      dismiss(); openPage("home"); return;
    }
    if(act==="instance-log") { const item=instances[state.object]; return openOutput({source:modules[item.module].label,run:"now",instance:item.path}); }
    if(act==="workspace") return showWorkspace();
    if(act==="preview-workspace") {
      try {
        const target=parseWorkspaceDraft();
        const current=new Map(instances.map(i=>[i.path,i]));
        const changes=target.flatMap(row=>{
          const before=current.get(row.path); current.delete(row.path);
          if(!before) return ["新增 "+row.path];
          if(before.module!==row.module||before.on!==row.on||JSON.stringify(initialConfig(before))!==JSON.stringify(row.config)) return ["修改 "+row.path];
          return [];
        }).concat([...current.keys()].map(id=>"移除 "+id));
        workspace.preview=target; workspace.base=workspace.revision;
        workspace.message=changes.length?changes.join("、"):"已检查，与当前运行目标一致。";
      } catch(error) { workspace.preview=null; workspace.message=error.message; }
      refreshWorkspace(); return;
    }
    if(act==="apply-workspace" && workspace.preview && workspace.base===workspace.revision) {
      const oldFailures=new Set(instances.filter(i=>i.failed&&i.on).map(i=>i.path));
      instances.splice(0,instances.length,...workspace.preview);
      for(const item of instances) if(item.failed&&item.on&&!oldFailures.has(item.path)) notifyFailure(item);
      workspace.edited=false; changedTarget(); workspace.draft=null; workspace.message="目标已接受。实际状态见概览，磁盘仍是修订 "+workspace.saved+"。";
      record("平台","信息","已应用工作区配置 · 修订 "+workspace.revision+"。"); drawShell(); return showWorkspace();
    }
    if(act==="save-workspace" && workspace.saved!==workspace.revision && workspace.draft===JSON.stringify(workspaceTarget(),null,2)) {
      workspace.saved=workspace.revision; workspace.message="示例磁盘已保存修订 "+workspace.saved+"。";
      record("平台","信息",workspace.message); return showWorkspace();
    }
    if(act==="show-problems") {
      rememberPanelOrigin(b); dismiss(); state.panel="问题"; drawPanel();
      $("bottom").querySelector('[data-name="问题"]').focus(); return;
    }
    if(act==="issue-log") {
      const item=instances[i], source=modules[item.module].label;
      const event=logs.filter(x=>x.run==="now" && x.source===source && x.instance===item.path && x.level==="错误").at(-1);
      return openOutput({source,run:"now",target:event?.id,instance:item.path});
    }
    if(act==="show-output"||act==="panel") {
      if(act==="panel"&&state.panel) return restorePanelFocus();
      return openOutput({trigger:b});
    }
    if(act==="hide-panel") return restorePanelFocus();
    if(act==="back"||act==="forward") return traverse(act==="back"?-1:1);
    if(act==="panel-tab") { state.panel=b.dataset.name; drawPanel(); b.focus(); return; }
    if(act==="clear-instance") { state.instance=""; drawPanel(); return; }
    if(act==="reset-filters") { Object.assign(state,{instance:"",source:"全部来源",level:"所有级别",target:0}); drawPanel(); $("channel").focus(); return; }
    if(act==="notices") return toggleNotices();
    if(act==="notice-log") { const n=notices.find(n=>n.id===Number(b.dataset.n)); return openOutput({source:n.source,run:n.run,target:n.id}); }
  }
  document.addEventListener("click",e=>{
    const button=e.target.closest("[data-act]");
    if(button?.closest("#matches")) closeLauncher(true);
    if(!e.target.closest("#topMenuBar")) closeMenu(Boolean(button?.closest("#topMenu")));
    if(button) handleAction(button);
  });
  document.addEventListener("focusin",e=>{
    if(e.target.closest("#main")&&e.target.matches("input,textarea,select,button")) state.contentFocus=e.target;
  });
  document.addEventListener("input",e=>{
    if(e.target.id==="query" && !duringComposition(e)) refreshQuery();
    if(e.target.dataset.validateOnEdit && !duringComposition(e)) validateInstanceField(e.target);
    if(e.target.id==="cfg"&&state.dialog==="config") drafts.set(instances[state.object].path,e.target.value);
    if(e.target.id==="configurationText") {
      workspace.draft=e.target.value;workspace.edited=workspace.draft!==JSON.stringify(workspaceTarget(),null,2);workspace.preview=null;workspace.message="编辑尚未检查。";refreshWorkspace();
    }
    if(e.target.id==="settingFilter" && !duringComposition(e)) filterSettings();
  });
  document.addEventListener("change",e=>{
    if(e.target.id==="backgroundFile") {
      const file=e.target.files[0];
      e.target.value="";
      void chooseBackground(file);
      return;
    }
    if(e.target.id==="module"&&state.dialog==="add") {
      $("cfg").value=JSON.stringify(e.target.value==="reporter"?{title:"测试报告",outputDirectory:"reports"}:{title:"测试采集"},null,2);
      if($("cfg").dataset.validateOnEdit) validateInstanceField($("cfg"));
    }
    if(e.target.id==="theme") setTheme(e.target.value==="dark");
    if(e.target.id==="windowMaterial") setMaterial(e.target.value);
    if(e.target.id==="pageTransition") setTransition(e.target.value);
    if(e.target.id==="navMode") setNavigation(e.target.value==="expanded");
    if(e.target.id==="navSize") setNavSize(Number.isFinite(e.target.valueAsNumber)?e.target.valueAsNumber:expandedNavWidth);
    if(e.target.id==="panelSize") setPanelHeight(Number.isFinite(e.target.valueAsNumber)?e.target.valueAsNumber:preferredPanelHeight);
    const key={run:"run",channel:"source",level:"level"}[e.target.id];
    if(key) { state[key]=e.target.value; state.target=0; if(key==="source") state.instance=""; drawPanel(); $(e.target.id)?.focus(); }
  });
  document.addEventListener("keydown",e=>{
    const composing=duringComposition(e);
    if(e.key==="Escape") imeEscape=Boolean(composing);
    if(composing || e.defaultPrevented) return;
    if(handleMenuKey(e)) { e.preventDefault(); return; }
    if(!launcherMode && !$("dialog").open && $("notices").hidden) {
      if(e.ctrlKey && e.key.toLowerCase()==="b") { e.preventDefault(); setNavigation(!$("app").classList.contains("expanded")); return; }
      if(e.ctrlKey && e.key.toLowerCase()==="f" && state.active==="settings") {
        e.preventDefault(); $("settingFilter").focus(); $("settingFilter").select(); return;
      }
      if(e.target.id==="settingFilter" && e.key==="Escape" && e.target.value) {
        e.preventDefault(); e.target.value=""; filterSettings(); return;
      }
      if(e.target.id==="settingFilter" && e.key==="Enter") {
        e.preventDefault();
        const row=document.querySelector(".settings-group:not([hidden]) [data-setting]:not([hidden])");
        const backgroundMatch=row?.querySelector("#materialSample") && /背景|图片|壁纸|换图|wallpaper|background/i.test(settingsQuery);
        const target=backgroundMatch?$("materialSample"):row?.querySelector("label")?.control || row?.querySelector("input,button,select,[tabindex]") || $("noSettings").querySelector("button");
        target?.focus(); return;
      }
    }
    if(e.altKey && !e.ctrlKey && !$("dialog").open && ["ArrowLeft","ArrowRight"].includes(e.key)) {
      e.preventDefault(); traverse(e.key==="ArrowLeft"?-1:1); return;
    }
    if(e.target.id==="query" && !launcherMode && ["ArrowDown","ArrowUp","Enter"].includes(e.key)) drawLauncher("search");
    if(launcherMode && e.target.id==="query") {
      if(e.key==="ArrowDown" || e.key==="ArrowUp") {
        e.preventDefault(); moveMatch(e.key==="ArrowUp"?-1:1); return;
      }
      if(e.key==="Enter") {
        e.preventDefault(); $("matches").children[Math.max(0,matchIndex)]?.click(); return;
      }
      if(e.key==="Escape") { e.preventDefault(); closeLauncher(true); return; }
      if(e.key==="Tab") closeLauncher();
    }
    if(e.key==="Escape"&&!$("dialog").open) {
      if(!$("notices").hidden) toggleNotices(); else if(state.panel) restorePanelFocus();
    }
    if(e.ctrlKey&&e.key.toLowerCase()==="p") { e.preventDefault(); drawLauncher(e.shiftKey?"commands":"search"); }
    if(e.ctrlKey&&e.key.toLowerCase()==="j"&&!$("dialog").open) { e.preventDefault(); closeLauncher(true); if(state.panel) restorePanelFocus(); else openOutput(); }
  });
  drawShell();
</script>
</html>
